<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1672px; height: 941px; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0b1220; color: #e6edf3; position: relative; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 64px 64px; }
  .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(15,127,73,.28), transparent 60%);
    top: -250px; right: -150px; }
  .left { position: absolute; left: 72px; top: 0; height: 100%; width: 528px;
    display: flex; flex-direction: column; justify-content: center; }
  h1 { width: 528px; font-size: 60px; line-height: 1.12; font-weight: 700;
    letter-spacing: -.5px; }
  h1 .accent { color: #2ecc8f; }
  .sub { width: 528px; margin-top: 30px; font-size: 26px; line-height: 1.5;
    color: #9fb0c0; }
  .shot { position: absolute; right: 64px; top: 50%; transform: translateY(-50%);
    width: 960px; height: 600px; background: #0d1526;
    border: 1px solid #223047; border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5); overflow: hidden; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .badge { position: absolute; left: 72px; bottom: 56px; width: 528px;
    display: flex; flex-wrap: wrap; gap: 12px; }
  .badge div { border: 1px solid #2a3c58; border-radius: 999px; padding: 10px 20px;
    font-size: 19px; color: #9fb0c0; background: rgba(17,27,48,.7); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="left">
    <h1><span class="accent">Blazor and Razor</span> in VS Code</h1>
    <div class="sub">C# hover, completion, diagnostics, go to definition, references and rename in .razor components and .cshtml pages.</div>
  </div>

  <div class="shot">
    <img src="../src/assets/screenshots/docs/blazor.webp" alt="">
  </div>

  <div class="badge">
    <div>.razor · .cshtml</div><div>Blazor Web App</div><div>Razor Pages · MVC</div><div>MIT</div>
  </div>
</body>
</html>
