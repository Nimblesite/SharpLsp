[package]
name = "sharplsp"
build = "build/build.rs"
version = { workspace = true }
edition = { workspace = true }
description = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }

[features]
# Sequestered formatting module (Roslyn + Fantomas). Disabled by default.
# Use CSharpier for C# and Fantomas via Ionide for F# instead.
formatting = []

[dependencies]
# Version dispatch — Shipwright binary version contract [DIST-VERSION-OUTPUT]
shipwright = "0.11"
shipwright-manifest = "0.11"
# Implements the executable packaging contract [BINARY-RUST].

# LSP
lsp-server = "0.10"
lsp-types = "0.97"

# Tree-sitter
tree-sitter = "0.27"
tree-sitter-c-sharp = "0.23"
tree-sitter-fsharp = "0.3"

# Async runtime
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "process", "sync", "macros", "fs"] }


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
rmp-serde = "1"
serde_bytes = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1"

# Shared toolkit and profiler ([PROFILER-SHARED-LIBRARY]), https://lspkit.dev
lsp-profiler = "0.4"
lsp-profiler-dotnet = "0.4"
lspkit = "0.4"
lspkit-server = { version = "0.4", features = ["pull"] }
globset = "0.4"
async-trait = "0.1"

# HTTP client (NuGet API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
dashmap = "6"
# RFC 8089 file:// URI ↔ path conversion (Windows drive letters, percent-decoding)
url = "2"
# Percent-decoding for file URIs with no native path representation (url's own dep)
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
wait-timeout = "0.2"
serde_json = "1"
# Native recovery and descendant sessions validate their own child processes.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[lints]
workspace = true
