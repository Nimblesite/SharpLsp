[package]
name = "sharplsp"
build = "build/build.rs"
version = { workspace = true }
edition = { workspace = true }
description = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }

[features]
# Sequestered formatting module (Roslyn + Fantomas). Disabled by default.
# Use CSharpier for C# and Fantomas via Ionide for F# instead.
formatting = []

[dependencies]
# Version dispatch — Shipwright binary version contract [DIST-VERSION-OUTPUT]
shipwright = "0.11"
shipwright-manifest = "0.11"
# Implements the executable packaging contract [BINARY-RUST].

# LSP
lsp-server = "0.10"
lsp-types = "0.97"

# Tree-sitter
tree-sitter = "0.27"
tree-sitter-c-sharp = "0.23"
tree-sitter-fsharp = "0.3"

# Async runtime
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "process", "sync", "macros", "fs"] }


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
rmp-serde = "1"
serde_bytes = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# OTLP export of spans and metrics, on when OTEL_EXPORTER_OTLP_ENDPOINT is set. [SHARPLSP-TECHNOLOGY-TELEMETRY]
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics"] }
tracing-opentelemetry = "0.34"

# Error handling
anyhow = "1"

# Shared toolkit and profiler ([PROFILER-SHARED-LIBRARY]), https://lspkit.dev
lsp-profiler = "0.6"
lsp-profiler-dotnet = "0.6"
lspkit = "0.6"
lspkit-server = { version = "0.6", features = ["pull"] }
# The semantic memo; the version lspkit-server memoizes diagnostics with. [DEFINITION-CACHE]
salsa = "0.28.5"
globset = "0.4"
async-trait = "0.1"

# HTTP client (NuGet API)
# gzip: nuget.org serves its VulnerabilityInfo blobs gzip-encoded unconditionally (#578).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# Utilities
dashmap = "6"
# RFC 8089 file:// URI ↔ path conversion (Windows drive letters, percent-decoding)
url = "2"
# Percent-decoding for file URIs with no native path representation (url's own dep)
percent-encoding = "2"
# Read MSBuild package declarations independently of XML formatting.
quick-xml = "0.41"
# Read a folder feed package's manifest: a `.nupkg` is a zip archive. [PKG-VULN-FIX]
zip = { version = "9.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The advisory fixture serves gzip, as nuget.org does (#578).
flate2 = "1"
tempfile = "3"
wait-timeout = "0.2"
serde_json = "1"
# Native recovery and descendant sessions validate their own child processes.
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

[lints]
workspace = true
