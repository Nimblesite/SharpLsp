# agent-pmo:a72c926
#
# Dependabot — supply-chain defence without PR spam, and without burning CI on
# `main` for routine bumps. Implements [DIST-CI-DEPENDABOT].
#
# EVERY bump ends up on the long-lived `dependabot-upgrades` STAGING branch,
# swept there by .github/workflows/dependabot-automerge.yml:
#
#   * VERSION updates -> `target-branch: dependabot-upgrades`, so Dependabot
#     opens them against staging directly. ci.yml / codeql.yml trigger only on
#     `pull_request: [main]` (the filter matches the PR *base*), so these PRs run
#     NO build, NO test, NO CodeQL.
#   * SECURITY updates -> GitHub IGNORES `target-branch` for these and ALWAYS
#     opens them against the default branch (`main`). The auto-merge workflow
#     therefore also fires on `main` and folds the security bump into the SAME
#     staging branch, then retires the PR — so a CVE bump never sits on `main`
#     waiting for a human either, and never burns the 40-minute matrix on a
#     change that is about to be superseded.
#   * groups -> each ecosystem collapses ALL version bumps (patch, minor AND
#     major) into ONE PR, and a parallel `*-security` group does the same for
#     CVE bumps. Majors do not need their own review PR because nothing reaches
#     `main` unattended — review happens once, at the
#     `dependabot-upgrades -> main` consolidation PR, where CI runs exactly once.
#   * interval: weekly -> one grouped PR per ecosystem per week, not fifty.
#
# REQUIREMENT: the `dependabot-upgrades` branch must exist and stay UNPROTECTED,
# and both it and `main` must carry dependabot-automerge.yml (for
# `pull_request`, the workflow is read from the PR's BASE branch).
version: 2

updates:
  # ── Rust: host crate ────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/"
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      rust-host:
        applies-to: version-updates
        patterns: ["*"]
      rust-host-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── Rust: Zed extension crate ───────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/src/editors/zed"
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      rust-zed:
        applies-to: version-updates
        patterns: ["*"]
      rust-zed-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── .NET: C#/F# sidecars solution ───────────────────────────────────
  - package-ecosystem: nuget
    directory: "/src/sidecars"
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      dotnet-sidecars:
        applies-to: version-updates
        patterns: ["*"]
      dotnet-sidecars-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── npm: VS Code extension ──────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/src/editors/vscode"
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      vscode-extension:
        applies-to: version-updates
        patterns: ["*"]
      vscode-extension-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── npm: website ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/src/website"
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      website:
        applies-to: version-updates
        patterns: ["*"]
      website-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── GitHub Actions: all workflows ───────────────────────────────────
  # Version-only: GitHub publishes no Dependabot security advisories for
  # actions, so there is no security channel to group.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "dependabot-upgrades"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]
    # dtolnay/rust-toolchain publishes no semver releases (only rolling
    # stable/nightly/per-version branches), so Dependabot's pinned-ref resolver
    # throws and fails the ENTIRE github-actions group update (run 28865233155).
    # Bump this action's SHA manually instead.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
