# agent-pmo:0b21609
---
# PHASE 4 — TEST. The VS Code leg on Ubuntu. [DIST-CI-VSIX-SHARDS]
#
# Pure fan-out. This workflow contains no build job and no packaging job: the
# compiled suite, the host, both sidecars, netcoredbg and the VSIX all come from
# PHASE 2, and the chunk matrix is an INPUT resolved there rather than something
# recomputed here.
#
# A chunk is a GROUP of feature areas, not one area per job. Every job repeats
# the same multi-minute preamble - setup-dotnet, node_modules, three artifact
# downloads, the VS Code host cache - so a matrix of 29 single-area jobs bought
# its parallelism by paying that preamble 29 times, and produced a check list
# too long to read. Ten grouped jobs pay it ten times and each still finishes
# well inside the ceiling below.
#
# It used to open with a `Compile suite` job and carry a `VSIX Payload` job, both
# of which had to re-install npm dependencies before doing anything. Compiling
# the suite in PHASE 2 - where the machine that compiles it is the machine that
# already has the toolchain hot - removed a job from the front of the fan-out,
# and packing the VSIX beside the binaries it packages removed another.
#
# EVERY SHARD IS INSTRUMENTED and NONE of them gates: no chunk can meet the line
# threshold alone, so the single ratcheted gate runs in PHASE 5 over the union of
# both platforms ([DIST-CI-VSIX-COVERAGE], ci-coverage.yml).
#
# The Windows leg (ci-test-vsix-windows.yml) owns win32 coverage; the chunks
# marked `linuxOnly` in the manifest - the real-world-repository stress suites -
# run only here.
name: CI / Test / VS Code
'on':
  workflow_call:
    inputs:
      chunks:
        description: JSON array of feature chunks, resolved by the PHASE 2 Linux build.
        required: true
        type: string
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  test-vsix:
    name: ${{ matrix.chunk }}
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    # A shard installs deps, downloads a compiled suite and prebuilt binaries,
    # and runs its slice against real Roslyn/FCS sidecars. That preamble is
    # FIXED COST paid once per job — several minutes of it — which is why a
    # chunk is a GROUP of feature areas and not a single one: at 29 jobs the
    # matrix spent more runner time on preamble than on tests, and read as a
    # wall of 29 rows nobody could scan.
    #
    # The ceiling is per JOB, so it scales with membership; it is not a budget
    # for one feature area to grow into. The per-test ceilings still live in
    # src/test/suite/test-timeouts.ts and none exceeds 2 minutes, so a job
    # approaching this is a hang, not a slow suite.
    timeout-minutes: 40
    strategy:
      # Every chunk is an independent GROUP of feature areas: one failure must
      # not cancel the rest, or a single flake hides the state of the whole
      # surface. The coverage gate still needs them all, so a failed chunk fails
      # the leg.
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(inputs.chunks) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run the shard
        uses: ./.github/actions/vsix-shard
        with:
          chunk: ${{ matrix.chunk }}
          platform: linux
          suite-artifact: vsix-suite-linux
          binaries-artifact: linux-lsp-binaries
          debugger-artifact: linux-netcoredbg
          debugger-path: target/netcoredbg/linux-x64/netcoredbg
          xvfb: 'true'
          user-data-dir: ${{ runner.temp }}/vsx-${{ matrix.chunk }}
