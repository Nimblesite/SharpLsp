# agent-pmo:0b21609
---
# PHASE 4 — TEST. The Rust leg. [DIST-CI-RUST-SHARDS]
#
# Consumes the PHASE 3 artifacts and rebuilds none of them: the release
# `sharplsp` host and both sidecars are downloaded, never recompiled.
#
# Instrumented Release test binaries and the static fixture are also built in
# phase 2. Shards execute nextest archives with no compiler and no retries.
name: CI / Test / Rust
'on':
  workflow_call: {}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  test-rust:
    name: Shard ${{ matrix.shard }}/2
    # The e2e suite runs single-threaded (tests spawn real Roslyn/FCS sidecars),
    # so wall time scales with test count, not cores. Two nextest hash
    # partitions halve the ~11-minute serial run. Each shard exports lcov; the
    # single ratcheted gate runs over the union in PHASE 5 (ci-coverage.yml),
    # because no partition can meet the full-suite threshold on its own.
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.303
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.nuget/packages"
          key: >-
            ${{ runner.os }}-nuget-${{ hashFiles('src/sidecars/**/*.csproj', 'src/sidecars/Directory.Build.props') }}
          restore-keys: "${{ runner.os }}-nuget-"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - uses: ./.github/actions/typediagram
      - name: Install .NET diagnostic tools
        run: |
          dotnet tool install -g dotnet-trace
          dotnet tool install -g dotnet-counters
          dotnet tool install -g dotnet-dump
      - name: Download prebuilt host and sidecars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-lsp-binaries
          path: target
      - name: Restore executable bit
        # download-artifact does not restore the +x the publish produced. The
        # e2e suite spawns the sidecars straight from these paths via the
        # RUST_E2E_SIDECARS env overrides, so without this every spawn fails
        # with "Permission denied (os error 13)" and the shard times out.
        shell: bash
        run: chmod +x target/sidecar-csharp/SharpLsp.Sidecar.CSharp target/sidecar-fsharp/SharpLsp.Sidecar.FSharp target/profiler-engine/lsp-profiler-dotnet-engine
      - name: Download precompiled Release tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-test-artifacts
          path: target
      - name: Restore static fixture binaries
        run: tar -xzf target/rust-fixtures.tar.gz
      - name: Test Rust shard with coverage
        run: env VSIX_PREBUILT=1 CARGO_TESTS_PREBUILT=1 make _test-rust-shard SHARD=${{ matrix.shard }} SHARD_COUNT=2
      - name: Upload sidecar logs
        # The e2e sidecars log beneath the temp folder. A failing shard keeps them,
        # so a compiler failure only this runner shows is read, not guessed.
        # [DIST-CI-RUST-SHARDS]
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-sidecar-logs-shard-${{ matrix.shard }}
          retention-days: 3
          if-no-files-found: ignore
          path: /tmp/sharplsp-logs
      - name: Upload shard coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust-shard-${{ matrix.shard }}
          retention-days: 1
          path: target/coverage-rust-shard${{ matrix.shard }}.lcov

  # NO coverage gate here. A shard tracefile is a partition, and the ratchet
  # needs the union of them, so the single gate lives in PHASE 5
  # (ci-coverage.yml) as the header above says. A second copy of that job also
  # uploaded an artifact named `coverage-rust`, which the PHASE 5 job already
  # publishes in the same run — and upload-artifact rejects a duplicate name,
  # failing the leg for a reason that has nothing to do with the tests.
  version-contract:
    name: Version Contract
    # Implements [DIST-VERSION-OUTPUT] + the version line of [DIST-CI-SMOKE].
    # Probes the artifact PHASE 2 published; `cargo metadata` only reads
    # Cargo.toml, so nothing here compiles.
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Download prebuilt release binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-lsp-binaries
          path: target
      - name: Restore executable bit
        shell: bash
        run: chmod +x target/release/sharplsp
      - name: Verify sharplsp version contract
        shell: bash
        run: |-
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 | node -e 'const fs=require("node:fs"); const meta=JSON.parse(fs.readFileSync(0,"utf8")); const pkg=meta.packages.find((item)=>item.name==="sharplsp"); if(!pkg) throw new Error("sharplsp package missing"); process.stdout.write(pkg.version);')"
          ./target/release/sharplsp --version | grep -Fx "sharplsp ${VERSION}"
          ./target/release/sharplsp --version --json | VERSION="${VERSION}" node -e 'const fs=require("node:fs"); const actual=JSON.parse(fs.readFileSync(0,"utf8")); const expected={name:"sharplsp",version:process.env.VERSION,kind:"lsp",language:"rust",product:"sharplsp"}; for (const [key,value] of Object.entries(expected)) { if (actual[key] !== value) throw new Error(`${key}: expected ${value}, got ${actual[key]}`); }'
