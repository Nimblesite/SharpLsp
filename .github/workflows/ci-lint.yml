# agent-pmo:0b21609
---
# Reusable lint leg of the PR pipeline (called by ci.yml).
#
# Test workflows intentionally do NOT `needs:` this one: lint and tests are
# independent required gates, and serializing tests behind lint added ~3 minutes
# to every PR's critical path. A lint failure still blocks the merge;
# `concurrency.cancel-in-progress` in ci.yml bounds wasted compute on
# rapid-fire pushes.
name: CI / Lint
'on':
  workflow_call: {}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  lint:
    name: All Languages
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            9.0.x
            10.0.300
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.nuget/packages"
          key: "${{ runner.os }}-nuget-${{ hashFiles('src/sidecars/**/*.csproj', 'src/sidecars/Directory.Build.props') }}"
          restore-keys: "${{ runner.os }}-nuget-"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/editors/vscode/package-lock.json
      - name: Install dependencies
        run: |
          dotnet tool restore
          npm ci --prefix src/editors/vscode
      - name: Lint (Rust)
        run: make _lint-rust PROFILE=debug
      - name: Lint (Zed)
        run: make _lint-zed
      - name: Format check (.NET)
        run: dotnet csharpier check src/sidecars/
      - name: Lint (.NET)
        run: make _lint-dotnet
      - name: Sidecar pack smoke test
        run: |
          dotnet pack src/sidecars/SharpLsp.Sidecar.CSharp/SharpLsp.Sidecar.CSharp.csproj \
            -p:PackageVersion=0.0.0-ci -c Release -o /tmp/nupkg-smoke
          dotnet pack src/sidecars/SharpLsp.Sidecar.FSharp/SharpLsp.Sidecar.FSharp.fsproj \
            -p:PackageVersion=0.0.0-ci -c Release -o /tmp/nupkg-smoke
          ls -la /tmp/nupkg-smoke/*.nupkg
      - name: Format check (VS Code)
        # Pinned to an exact version: `npx prettier@3` floats to the latest 3.x,
        # so a new patch release can reformat previously-clean files and fail
        # this gate non-deterministically (local prettier drifts from CI's).
        # Bump this deliberately, in lockstep with a repo-wide `--write`.
        run: cd src/editors/vscode && npx prettier@3.9.4 --check 'src/**/*.ts'
      - name: Lint (VS Code)
        # Includes `_check-vsix-chunks`: fails if any VS Code suite belongs to no
        # Windows feature chunk, so a new suite cannot silently skip
        # [DIST-CI-WIN-VSIX].
        run: make _lint-vsix
