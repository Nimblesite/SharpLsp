# agent-pmo:0b21609
name: Release
'on':
  push:
    tags:
      - v*

# Least-privilege default: every job is read-only unless it explicitly
# escalates (the GitHub Release job needs contents: write; deploy-pages needs
# pages/id-token). [DIST-SECRETS]
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Tag → release. The tagged SHA is built verbatim: NO branch detection, NO
  # commit, NO push. Stamping happens runner-local in each build job.
  # [DIST-RELEASE] [DIST-VERSION-INVARIANT]
  version:
    name: Prepare release version
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      version: "${{ steps.extract.outputs.version }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Extract version from tag
        id: extract
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Reuses the exact validator invocation from ci.yml so CI and release stay
      # in sync — the manifest is the source of truth for what ships.
      - name: Validate shipwright manifest
        shell: bash
        run: |-
          set -euo pipefail
          tmp="$(mktemp -d)"
          npm install --prefix "$tmp" @nimblesite/shipwright-validate-manifest@0.9.0
          "$tmp/node_modules/.bin/shipwright-validate-manifest" \
            --schema .github/shipwright/deployment-toolkit.schema.json \
            shipwright.json src/editors/vscode/shipwright.json

  # CodeQL release gate. Scans the tagged SHA with the current query set and
  # FAILS on any High/Critical finding. The `release` job `needs:` this, so a
  # failed scan blocks the GitHub Release and every downstream publish
  # (marketplace, open-vsx, pages). Runs in PARALLEL with build-vsix — rebuilding
  # is cheap; shipping an unscanned release is not. Reuses codeql.yml via
  # workflow_call (DRY — no duplicated matrix). [DIST-CI-SECURITY] [DIST-RELEASE]
  codeql:
    name: CodeQL release gate
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: ./.github/workflows/codeql.yml
    with:
      gate: true

  build-vsix:
    name: Build VSIX (${{ matrix.platform }})
    needs: version
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            can_execute: true
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            can_execute: true
          - platform: darwin-arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            can_execute: true
          # This just spins forever on GitHub's hosted runners
          # - platform: darwin-x64
          #   os: macos-13
          #   rust_target: x86_64-apple-darwin
          #   can_execute: true
          - platform: win32-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            can_execute: true
          - platform: win32-arm64
            os: windows-latest
            rust_target: aarch64-pc-windows-msvc
            can_execute: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Each build job stamps the version into the runner working tree from the
      # tag — deterministic, no artifact hand-off, nothing committed.
      # [DIST-RELEASE] [DIST-VERSION-INVARIANT]
      - name: Stamp release version
        shell: bash
        run: make _stamp-version VERSION="${{ needs.version.outputs.version }}"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: "${{ matrix.rust_target }}"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: "${{ matrix.rust_target }}"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.303
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/editors/vscode/package-lock.json
      - name: Install VS Code extension dependencies
        run: npm ci --prefix src/editors/vscode
      - name: Set platform variables
        shell: bash
        run: |
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          echo "EXE=${exe}" >> "$GITHUB_ENV"
      # Builds the Rust host and both sidecars once, then emits BOTH release
      # artifacts for this platform: the VSIX and the standalone server archive
      # ([DIST-ARCHIVE]) that every non-VS-Code editor and the package managers
      # install.
      - name: Package VSIX + standalone server archive
        shell: bash
        run: make package-vsix-${{ matrix.platform }} RUST_TARGET=${{ matrix.rust_target
          }} VERSION="${{ needs.version.outputs.version }}"
      - name: Verify binary version
        if: "${{ matrix.can_execute }}"
        shell: bash
        run: |
          set -euo pipefail
          "target/${{ matrix.rust_target }}/release/sharplsp${EXE}" --version | grep -Fx "sharplsp ${{ needs.version.outputs.version }}"
      - name: Verify VSIX contains all binaries
        shell: bash
        run: |
          set -euo pipefail
          unzip -l "dist/sharplsp-${{ matrix.platform }}.vsix" | grep -F "bin/${{ matrix.platform }}/sharplsp${EXE}"
          unzip -l "dist/sharplsp-${{ matrix.platform }}.vsix" | grep -F "bin/all/sharplsp-sidecar-csharp"
          unzip -l "dist/sharplsp-${{ matrix.platform }}.vsix" | grep -F "bin/all/sharplsp-sidecar-fsharp"
          # Negative check: no foreign-platform binary dirs leaked into the VSIX.
          # [DIST-CI-SMOKE]
          if unzip -l "dist/sharplsp-${{ matrix.platform }}.vsix" | grep -Eo 'bin/[a-z0-9]+-[a-z0-9]+/sharplsp' | grep -v "bin/${{ matrix.platform }}/sharplsp"; then
            echo "::error::foreign-platform binary found in dist/sharplsp-${{ matrix.platform }}.vsix"
            exit 1
          fi
      # The archive is the ONLY artifact a Rider / Zed / Neovim / Helix user can
      # install, and what Homebrew and Scoop pull from ([DIST-PATH-INSTALL]). A
      # layout mistake in it is invisible to every VSIX check above. The verifier
      # is shared with ci-build.yml so a PR catches the same regressions a tag
      # would. [DIST-ARCHIVE] [DIST-CI-SMOKE]
      - name: Verify standalone server archive
        shell: bash
        run: |
          # A cross-compiled target the runner cannot execute gets the layout
          # check only. Set in shell, not a `${{ }}` env expression: GitHub's
          # `a && '' || '1'` treats the empty string as falsy and yields '1' for
          # BOTH branches, which would skip the smoke test everywhere.
          if [ "${{ matrix.can_execute }}" != "true" ]; then
            export SKIP_RUN=1
          fi
          bash tools/packaging/verify-archive.sh ${{ matrix.platform }} "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ matrix.platform }}
          path: dist/*.vsix
          if-no-files-found: error
      # Uploaded separately from the VSIX so publish-marketplace / publish-openvsx
      # keep globbing a directory that holds nothing but .vsix files.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The Rider plugin is a release artifact in its own right: JetBrains users have
  # no VSIX to install and no marketplace listing to pull from, so the zip on the
  # GitHub release IS the distribution channel. [DIST-RIDER-RELEASE]
  build-rider:
    name: Build Rider plugin
    needs: version
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    # RIDER_REQUIRED=1 makes a missing JDK a hard failure. Without it the Gradle
    # wrapper skips silently and the release would ship no Rider plugin while
    # reporting success — exactly the gap this job closes.
    env:
      RIDER_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stamp release version
        shell: bash
        run: make _stamp-version VERSION="${{ needs.version.outputs.version }}"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # Mirrors ci-editors.yml: the IntelliJ Platform SDK is a multi-GB Gradle
      # download that otherwise dominates this job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/editors/rider/.intellijPlatform
          key: "${{ runner.os }}-gradle-${{ hashFiles('src/editors/rider/build.gradle.kts', 'src/editors/rider/gradle.properties', 'src/editors/rider/gradle/**') }}"
          restore-keys: "${{ runner.os }}-gradle-"
      - name: Build Rider plugin
        run: make _build-rider
      - name: Verify plugin zip is versioned and non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/sharplsp-rider.zip || {
            echo "::error::dist/sharplsp-rider.zip missing or empty"
            exit 1
          }
          # buildPlugin names the zip from pluginVersion; _stamp-version writes the
          # tag into it. A stale 0.1.0 here means stamping silently stopped working.
          ls src/editors/rider/build/distributions/sharplsp-rider-${{ needs.version.outputs.version }}.zip
          unzip -l dist/sharplsp-rider.zip | grep -F 'sharplsp-rider/lib/'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rider-plugin
          path: dist/sharplsp-rider.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - version
      - build-vsix
      - build-rider
      - codeql
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Three downloads, one directory. publish-marketplace and publish-openvsx
      # pull `vsix-*` on their own and must keep seeing a directory of nothing but
      # VSIXes, so the artifacts stay split at upload and are merged only here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: vsix-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: server-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          name: rider-plugin
      # Every published asset is checksummed, not just the VSIXes — the Homebrew
      # formula and Scoop manifest verify the server archives against this file.
      # [DIST-ARCHIVE]
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS
          for f in *.vsix *.tar.gz *.zip; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS
          # A release that silently drops a platform is the failure this catches:
          # one VSIX and one server archive per built platform, plus the Rider zip.
          expected=$(( 2 * ${PLATFORM_COUNT} + 1 ))
          actual="$(wc -l < SHA256SUMS)"
          if [ "${actual}" -ne "${expected}" ]; then
            echo "::error::expected ${expected} checksummed assets, found ${actual}"
            exit 1
          fi
        env:
          # Kept beside the build-vsix matrix: adding a platform there without
          # updating this count fails the release loudly instead of shipping short.
          PLATFORM_COUNT: '5'
      # Hyphenated SemVer tags (v0.2.0-rc.1, v0.2.0-beta) are marked prerelease so
      # they never become the "Latest release". [DIST-RELEASE] [DIST-RELEASE]
      - name: Create GitHub release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: |
          set -euo pipefail
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SharpLsp ${{ needs.version.outputs.version }}" \
            --generate-notes \
            ${prerelease} \
            artifacts/*.vsix \
            artifacts/*.tar.gz \
            artifacts/*.zip \
            artifacts/SHA256SUMS

  # Release tags deploy their exact website revision. Website-only changes also
  # deploy after merging to main through deploy-pages.yml's push trigger.
  deploy-pages:
    name: Deploy website to GitHub Pages
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  publish-marketplace:
    name: Publish VSIX to VS Code Marketplace
    needs:
      - version
      - release
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    # 20m: allows retry-with-backoff on transient Marketplace 5xx failures.
    timeout-minutes: 20
    # Passwordless publish via Microsoft Entra ID OIDC — NO long-lived PAT.
    # Binding the job to the `release` environment makes the GitHub OIDC subject
    # deterministic (repo:OWNER/REPO:environment:release), so ONE federated
    # credential covers every v* tag — Entra rejects tag wildcards in an explicit
    # federated subject. Secrets (Azure app's client + tenant id, neither
    # sensitive) live on the `release` environment. [DIST-SECRETS]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: vsix-*
          merge-multiple: true
      # Exchange the GitHub Actions OIDC token for an Entra ID session (no client
      # secret). The publisher identity has no Azure subscription role — its only
      # authorization is Marketplace publisher membership — hence
      # allow-no-subscriptions.
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
          allow-no-subscriptions: true
      # One `vsce publish` per platform-specific VSIX — vsce silently uses only the
      # first when several are globbed into a single call. We mint an Azure DevOps
      # / Marketplace-scoped Entra access token from the OIDC session and hand it to
      # vsce via VSCE_PAT (kept off argv + masked). 499b84ac-... is Azure DevOps'
      # fixed first-party app id that vsce authenticates against; this explicit
      # short-lived-token path is the reliable PAT-less recipe and sidesteps the
      # `--azure-credential` publish bug (microsoft/vscode-vsce#1023). vsce is
      # version-pinned: a floating `npx @vscode/vsce` would fetch and run the latest
      # release inside the job that holds the token — a supply-chain risk. A
      # hyphenated tag is published with --pre-release (the VSIX is packaged with
      # --pre-release in the Makefile for hyphenated versions).
      - name: Publish each platform VSIX (Entra OIDC, no PAT)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
            echo "Prerelease tag ${GITHUB_REF_NAME}; publishing with --pre-release"
          fi
          VSCE_PAT="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)"
          echo "::add-mask::${VSCE_PAT}"
          export VSCE_PAT
          published=0
          skipped=0
          # Retry transient registry failures (5xx, resets, DNS/network blips)
          # with exponential backoff — a gallery outage must not kill the
          # release. Return codes: 0 published, 2 already present, 1 fatal.
          publish_with_retry() {
            local vsix="$1" out attempts=0 delay=15
            while :; do
              attempts=$((attempts + 1))
              if out="$(npx --yes @vscode/vsce@3.9.2 publish ${flag} --packagePath "${vsix}" 2>&1)"; then
                printf '%s\n' "${out}"
                return 0
              fi
              if printf '%s' "${out}" | grep -qi 'already exists'; then
                printf '%s\n' "${out}"
                return 2
              fi
              if [ "${attempts}" -ge 5 ] ||
                 ! printf '%s' "${out}" | grep -qiE 'status 5[0-9][0-9]|service unavailable|temporarily unavailable|bad gateway|gateway time|ECONNRESET|ETIMEDOUT|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|fetch failed|network error'; then
                printf '%s\n' "${out}" >&2
                return 1
              fi
              echo "Transient publish error (attempt ${attempts}/5) for ${vsix}; retrying in ${delay}s"
              sleep "${delay}"
              delay=$((delay * 2))
            done
          }
          for vsix in artifacts/**/*.vsix; do
            echo "Publishing ${vsix}"
            # Idempotent: a transient gallery timeout can leave some platforms
            # already published. Treat "already exists" as success so a re-run
            # completes the remaining platforms instead of dying on the first one.
            rc=0
            publish_with_retry "${vsix}" || rc=$?
            case "${rc}" in
              0) published=$((published + 1)) ;;
              2)
                echo "Skipping ${vsix}: this version+platform is already published."
                skipped=$((skipped + 1)) ;;
              *)
                echo "::error::vsce publish failed for ${vsix}"
                exit 1 ;;
            esac
          done
          if [ "$((published + skipped))" -eq 0 ]; then
            echo "::error::no VSIX artifacts found to publish"
            exit 1
          fi
          echo "Marketplace: published ${published}, skipped ${skipped} already-present of $((published + skipped)) VSIX(es)"

  # Homebrew and Scoop install the standalone server archive ([DIST-ARCHIVE]),
  # not the VSIX — they are how Rider, Zed, Neovim and Helix users get the binary
  # onto PATH ([DIST-PATH-INSTALL]). Two jobs, not one: a tap outage must not
  # block the bucket, the same independence publish-marketplace and
  # publish-openvsx keep from each other.
  #
  # Prerelease tags are skipped. `brew install` and `scoop install` have no
  # prerelease channel, so pushing an rc would hand every stable user a
  # prerelease on their next upgrade.
  publish-homebrew:
    name: Publish Homebrew formula
    needs:
      - version
      - release
    if: "${{ !contains(github.ref_name, '-') }}"
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Fail here rather than at `git push`. Both tap repos are public, so an
      # absent secret clones happily and then dies with an opaque auth error
      # after the release is already out.
      - name: Require BREW_SCOOP_PAT
        env:
          BREW_SCOOP_PAT: "${{ secrets.BREW_SCOOP_PAT }}"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BREW_SCOOP_PAT:-}" ]; then
            echo "::error::BREW_SCOOP_PAT is not available to this repository."
            echo "::error::Grant SharpLsp access to the org secret, or add it as a repo secret with contents:write on Nimblesite/homebrew-tap and Nimblesite/scoop-bucket."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # Checksums come from the archives actually published, never from a
      # hand-edited formula — a carried-over sha256 is the classic tap bug.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: server-*
          merge-multiple: true
      - name: Render formula
        run: |
          node tools/packaging/render-package-manifests.mjs \
            --version "${{ needs.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --archives artifacts \
            --out dist/packaging
      - name: Check out homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nimblesite/homebrew-tap
          token: "${{ secrets.BREW_SCOOP_PAT }}"
          path: homebrew-tap
      - name: Commit and push formula
        run: |
          set -euo pipefail
          bash tools/packaging/publish-package-repo.sh \
            homebrew-tap \
            dist/packaging/sharplsp.rb \
            Formula/sharplsp.rb \
            "sharplsp ${{ needs.version.outputs.version }}"

  publish-scoop:
    name: Publish Scoop manifest
    needs:
      - version
      - release
    if: "${{ !contains(github.ref_name, '-') }}"
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Fail here rather than at `git push`. Both tap repos are public, so an
      # absent secret clones happily and then dies with an opaque auth error
      # after the release is already out.
      - name: Require BREW_SCOOP_PAT
        env:
          BREW_SCOOP_PAT: "${{ secrets.BREW_SCOOP_PAT }}"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BREW_SCOOP_PAT:-}" ]; then
            echo "::error::BREW_SCOOP_PAT is not available to this repository."
            echo "::error::Grant SharpLsp access to the org secret, or add it as a repo secret with contents:write on Nimblesite/homebrew-tap and Nimblesite/scoop-bucket."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: server-*
          merge-multiple: true
      - name: Render manifest
        run: |
          node tools/packaging/render-package-manifests.mjs \
            --version "${{ needs.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --archives artifacts \
            --out dist/packaging
      - name: Check out scoop-bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nimblesite/scoop-bucket
          token: "${{ secrets.BREW_SCOOP_PAT }}"
          path: scoop-bucket
      - name: Commit and push manifest
        run: |
          set -euo pipefail
          bash tools/packaging/publish-package-repo.sh \
            scoop-bucket \
            dist/packaging/sharplsp.json \
            bucket/sharplsp.json \
            "sharplsp ${{ needs.version.outputs.version }}"

  publish-openvsx:
    name: Publish VSIX (Open VSX)
    needs:
      - version
      - release
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    # 20m: allows retry-with-backoff on transient Open VSX 5xx failures
    # (observed: 503 Service Unavailable mid-batch on 2026-08-29).
    timeout-minutes: 20
    # Independent of publish-marketplace: the Open VSX push (Cursor, Windsurf,
    # Antigravity) must not be gated on the MS Marketplace publish, or vice versa.
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: vsix-*
          merge-multiple: true
      # ovsx is version-pinned: a floating `npx ovsx` would fetch and run the
      # latest release at publish time, inside the job that holds the token — a
      # supply-chain risk. Bump deliberately. Secret: OPEN_VSX_PAT.
      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: "${{ secrets.OPEN_VSX_PAT }}"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OPEN_VSX_PAT is not set; cannot publish to Open VSX"
            exit 1
          fi
          shopt -s globstar nullglob
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
          fi
          published=0
          skipped=0
          # Retry transient registry failures (5xx, resets, DNS/network blips)
          # with exponential backoff — an Open VSX outage must not kill the
          # release. Return codes: 0 published, 2 already present, 1 fatal.
          publish_with_retry() {
            local vsix="$1" out attempts=0 delay=15
            while :; do
              attempts=$((attempts + 1))
              if out="$(npx --yes ovsx@1.0.0 publish ${flag} --packagePath "${vsix}" 2>&1)"; then
                printf '%s\n' "${out}"
                return 0
              fi
              if printf '%s' "${out}" | grep -qiE 'already exists|already published'; then
                printf '%s\n' "${out}"
                return 2
              fi
              if [ "${attempts}" -ge 5 ] ||
                 ! printf '%s' "${out}" | grep -qiE 'status 5[0-9][0-9]|service unavailable|temporarily unavailable|bad gateway|gateway time|ECONNRESET|ETIMEDOUT|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|fetch failed|network error'; then
                printf '%s\n' "${out}" >&2
                return 1
              fi
              echo "Transient publish error (attempt ${attempts}/5) for ${vsix}; retrying in ${delay}s"
              sleep "${delay}"
              delay=$((delay * 2))
            done
          }
          for vsix in artifacts/**/*.vsix; do
            echo "Publishing ${vsix}"
            # Idempotent re-runs: tolerate an already-published platform version
            # so a partial publish can be completed by re-running the job.
            rc=0
            publish_with_retry "${vsix}" || rc=$?
            case "${rc}" in
              0) published=$((published + 1)) ;;
              2)
                echo "Skipping ${vsix}: this version+platform is already published."
                skipped=$((skipped + 1)) ;;
              *)
                echo "::error::ovsx publish failed for ${vsix}"
                exit 1 ;;
            esac
          done
          if [ "$((published + skipped))" -eq 0 ]; then
            echo "::error::no VSIX artifacts found to publish"
            exit 1
          fi
          echo "Open VSX: published ${published}, skipped ${skipped} already-present of $((published + skipped)) VSIX(es)"
