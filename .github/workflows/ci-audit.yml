---
# PHASE 1 — ANALYSE. Dependency vulnerability audit. [DIST-CI-AUDIT]
#
# Runs `make audit`: every Rust (cargo audit / RustSec), .NET (dotnet list
# package --vulnerable, transitive included) and npm (npm audit) dependency
# ALREADY in the tree is checked against its ecosystem's advisory database, and
# the job fails on anything at or above the Makefile's AUDIT_LEVEL. The log lists
# each vulnerable package, its version, the advisory and what to upgrade.
#
# Dependency review (ci.yml `security`) only sees what a PR ADDS. An advisory
# published against a dependency we already ship never appears in a PR diff, so
# without this job it would ship indefinitely.
#
# ONE job, three callers, so the check that passes a PR is the check that passes
# a release:
#   ci.yml       every PR
#   release.yml  the tagged SHA, just before publishing - `release` needs it, so
#                a vulnerable dependency blocks the GitHub Release and every
#                downstream publish
#   schedule     weekly on main, because advisories land between PRs
name: CI / Audit
'on':
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    name: Vulnerable Dependencies
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Audit Rust, .NET and npm dependencies
        run: make audit
