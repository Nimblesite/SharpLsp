# agent-pmo:0b21609
---
# PHASE 4 — TEST. The editor-integration leg. [DIST-CI-EDITORS]
#
# Both of these shipped for their whole history with no CI job at all. The Zed
# extension's 23 unit tests existed in the tree and were compiled by
# `make _lint-zed` but never executed; the Rider plugin had a fully configured
# JUnit harness and not one test file, and was not even compiled on a PR.
#
# Neither consumes a PHASE 2 artifact, because neither links against one: the Zed
# extension is a standalone Cargo workspace that ships as wasm32-wasip1, and the
# Rider plugin is a Kotlin/IntelliJ build. What each compiles here is its own
# instrumented test binaries, the same category of work the Rust shards do, and
# for the same reason - an instrumented build is not the artifact PHASE 2
# produced.
#
# PHASE 5 for both is the ratchet inside the make target. Neither suite is
# sharded, so each gate sees a complete tracefile in-job and needs no separate
# merge, unlike the Rust and VS Code legs (ci-coverage.yml).
name: CI / Test / Editors
'on':
  workflow_call: {}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  test-zed:
    name: Zed Extension
    # The root `cargo llvm-cov` run in ci-test-rust.yml cannot see this
    # workspace, so it needs its own gate. Its unit tests build for the host.
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src/editors/zed
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Test + coverage gate (Zed)
        run: make _test-zed

  test-rider:
    name: Rider Plugin
    # RIDER_REQUIRED=1 turns "no JDK 21+ found" from a local convenience skip
    # into a hard failure. Without it a toolchain regression would present as a
    # passing job that ran nothing.
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      RIDER_REQUIRED: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # kover-line-percent.cs is a `dotnet run --file` app, matching how
      # merge-cobertura.cs reads the sidecar reports.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.303
      # The IntelliJ Platform SDK is a multi-GB download resolved through
      # Gradle. Uncached, it dominates this job's wall time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/editors/rider/.intellijPlatform
          key: >-
            ${{ runner.os }}-gradle-${{ hashFiles('src/editors/rider/build.gradle.kts',
            'src/editors/rider/gradle.properties', 'src/editors/rider/gradle/**') }}
          restore-keys: "${{ runner.os }}-gradle-"
      - name: Test + coverage gate (Rider)
        run: make _test-rider
      - name: Build plugin
        # The shippable plugin zip. It stays here rather than in PHASE 2 because
        # it reuses the Gradle daemon and the IntelliJ SDK this job has already
        # resolved - building it on a separate PHASE 2 runner would compile the
        # same Kotlin twice and re-download a multi-GB SDK to do it. Nothing
        # downstream consumes the zip; this is the check that a Kotlin break
        # cannot reach main behind a green pipeline.
        run: make _build-rider
