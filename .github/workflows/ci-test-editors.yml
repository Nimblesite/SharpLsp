# agent-pmo:0b21609
---
# PHASE 4 — TEST. The editor-integration leg. [DIST-CI-EDITORS]
#
# Both of these shipped for their whole history with no CI job at all. The Zed
# extension's 23 unit tests existed in the tree and were compiled by
# `make _lint-zed` but never executed; the Rider plugin had a fully configured
# JUnit harness and not one test file, and was not even compiled on a PR.
#
# Both consume phase-2 artifacts. Zed executes its Release nextest archive;
# Rider restores its plugin/test classes and rejects compiler tasks. Nothing
# in this workflow compiles or packages the product.
#
# PHASE 5 for both is the ratchet inside the make target. Neither suite is
# sharded, so each gate sees a complete tracefile in-job and needs no separate
# merge, unlike the Rust and VS Code legs (ci-coverage.yml).
name: CI / Test / Editors
'on':
  workflow_call: {}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  test-zed:
    name: Zed Extension
    # The root `cargo llvm-cov` run in ci-test-rust.yml cannot see this
    # workspace, so it needs its own gate. Its unit tests build for the host.
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Download precompiled Release tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zed-test-artifacts
          path: .
      - name: Test + coverage gate (Zed)
        run: make _test-zed CARGO_TESTS_PREBUILT=1

  test-rider:
    name: Rider Plugin
    # RIDER_REQUIRED=1 turns "no JDK 21+ found" from a local convenience skip
    # into a hard failure. Without it a toolchain regression would present as a
    # passing job that ran nothing.
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      RIDER_REQUIRED: '1'
      RIDER_TESTS_PREBUILT: '1'
      COVERAGE_TOOLS_PREBUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/rider-environment
      # kover-line-percent.cs is a `dotnet run --file` app, matching how
      # merge-cobertura.cs reads the sidecar reports.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.303
      # The IntelliJ Platform SDK is a multi-GB download resolved through
      # Gradle. Uncached, it dominates this job's wall time.
      - name: Download compiled plugin and test classes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rider-test-artifacts
          path: target
      - name: Restore compiled Rider output
        run: tar -xzf target/rider-tests.tar.gz -C src/editors/rider
      - name: Download precompiled coverage tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-tools
          path: target/coverage-tools
      - name: Test + coverage gate (Rider)
        run: make _test-rider
