# agent-pmo:0b21609
---
# PHASE 2 (FULL BUILD) + PHASE 3 (CACHE). [DIST-CI-LAYOUT]
#
# Everything the pipeline needs, built for every platform, ONCE, and published.
# The two jobs below are SIBLINGS: no `needs:` between them, so Ubuntu and
# Windows compile concurrently and PHASE 2 costs one platform's build, not the
# sum of both.
#
# That is the fix for the pipeline's largest structural defect. The Windows
# build used to live in the TEST phase, gated on the Ubuntu build - which it
# consumes nothing from - so it began 6m45 after the run started and every
# Windows test chunk began 11m02 after that. 18 minutes of a 41-minute pipeline
# was builds waiting on other builds.
#
# Both jobs run the SAME composite action (../actions/build-platform). There is
# no Windows-only build recipe: the two had already drifted apart once, to the
# point where Windows ran its whole VS Code suite uninstrumented while Ubuntu
# carried the entire coverage number.
#
# PHASE 3 is the handoff boundary. Every artifact a test job needs is uploaded
# here, and NOTHING downstream of this workflow is permitted to compile
# anything. A test leg that invokes cargo, dotnet build or tsc is a bug.
name: CI / Build
'on':
  workflow_call:
    outputs:
      linux-chunks:
        description: JSON array of VS Code feature chunks to run on Ubuntu.
        value: ${{ jobs.build-linux.outputs.chunks }}
      win-chunks:
        description: JSON array of VS Code feature chunks to run on Windows.
        value: ${{ jobs.build-windows.outputs.chunks }}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  build-linux:
    name: Linux
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      chunks: ${{ steps.build.outputs.chunks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.303
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.nuget/packages"
          key: "${{ runner.os }}-nuget-${{ hashFiles('src/sidecars/**/*.csproj', 'src/sidecars/Directory.Build.props') }}"
          restore-keys: "${{ runner.os }}-nuget-"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/editors/vscode/package-lock.json
      - name: Install dependencies
        run: |
          dotnet tool restore
          npm ci --prefix src/editors/vscode

  build-windows:
    name: Windows
    # NO `needs:`. This is a sibling of build-linux, not its successor - it
    # consumes nothing Ubuntu produces, and gating it on Ubuntu bought the
    # pipeline nothing but 6m45 of idle Windows runner.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 40
    outputs:
      chunks: ${{ steps.build.outputs.chunks }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build every Windows artifact
        id: build
        uses: ./.github/actions/build-platform
        with:
          platform: win
          vsix-platform: win32-x64
          host-binary: target/release/sharplsp.exe
          suite-artifact: vsix-suite-win
          binaries-artifact: win-lsp-binaries
          debugger-artifact: win-netcoredbg
