# agent-pmo:0b21609
---
# PHASE 4 — TEST. The repo's own build tooling.
#
# Everything else in phase 4 tests the PRODUCT. This leg tests the machinery the
# product is built with, and specifically the supply-chain path: how the patched
# netcoredbg debug adapter is obtained ([DIST-DEBUGGER-BUNDLE]).
#
# That path had no test at all while it was a source build, and it is the one
# piece of the pipeline where a silent failure ships a different binary to users
# rather than turning CI red - so the assertions that matter here are the
# refusals: a digest mismatch must fail, must unpack nothing, and must NOT fall
# back to compiling from source.
#
# Node's built-in runner executes the source builder compiled in PHASE 2.
# This consumer installs its runtime but never compiles the builder or product.
name: CI / Test / Tooling
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  test-tooling:
    name: Build Tooling
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            9.0.x
            10.0.404
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lint-source-builder
          path: target/lint-source-builder
      - name: Test the build tooling
        env:
          TOOLING_TESTS_PREBUILT: '1'
        run: make _test-tooling
      # [DIAG-HYGIENE-GUARD] The prebuilt host and sidecars analyse this checkout:
      # a diagnostic outside the demo fixtures fails the build. No product rebuild;
      # the Debug build only gives the projects their design-time references.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.nuget/packages"
          key: >-
            ${{ runner.os }}-nuget-${{ hashFiles('src/sidecars/**/*.csproj', 'src/sidecars/Directory.Build.props') }}
          restore-keys: "${{ runner.os }}-nuget-"
      - name: Download prebuilt host and sidecars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-lsp-binaries
          path: target
      - name: Restore executable bit
        shell: bash
        run: chmod +x target/release/sharplsp target/sidecar-csharp/SharpLsp.Sidecar.CSharp target/sidecar-fsharp/SharpLsp.Sidecar.FSharp
      - name: Workspace diagnostics of this repository
        run: make _check-workspace-diagnostics PREBUILT=1
