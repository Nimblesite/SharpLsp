# agent-pmo:0b21609
---
# PHASE 4 — TEST. The repo's own build tooling.
#
# Everything else in phase 4 tests the PRODUCT. This leg tests the machinery the
# product is built with, and specifically the supply-chain path: how the patched
# netcoredbg debug adapter is obtained ([DIST-DEBUGGER-BUNDLE]).
#
# That path had no test at all while it was a source build, and it is the one
# piece of the pipeline where a silent failure ships a different binary to users
# rather than turning CI red - so the assertions that matter here are the
# refusals: a digest mismatch must fail, must unpack nothing, and must NOT fall
# back to compiling from source.
#
# Node's built-in runner executes the source builder compiled in PHASE 2.
# This consumer installs its runtime but never compiles the builder or product.
name: CI / Test / Tooling
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  test-tooling:
    name: Build Tooling
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.303
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lint-source-builder
          path: target/lint-source-builder
      - name: Test the build tooling
        env:
          TOOLING_TESTS_PREBUILT: '1'
        run: make _test-tooling
