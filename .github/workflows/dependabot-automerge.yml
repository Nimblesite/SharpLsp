# agent-pmo:a72c926
---
# Sweeps EVERY Dependabot PR into the long-lived `dependabot-upgrades` staging
# branch, unattended. Implements [DIST-CI-DEPENDABOT].
#
# TWO CHANNELS, because Dependabot splits its output across two base branches:
#   * VERSION updates  -> opened against `dependabot-upgrades` directly, via
#     `target-branch` in .github/dependabot.yml.
#   * SECURITY updates -> GitHub IGNORES `target-branch` for these and ALWAYS
#     opens them against the default branch (`main`). So this workflow also
#     triggers on `main` and folds the security bump into the SAME staging
#     branch, then retires the PR.
#
# WHY SECURITY BUMPS GO TO STAGING TOO, rather than merging into `main` behind
# required checks: ci.yml/codeql.yml deliberately SKIP Dependabot PRs, so there
# are no checks left on `main` for such a PR to queue behind — `--auto` would
# either hang forever or squash the bump in unverified. Sweeping it into staging
# instead keeps ONE gate for dependency changes: the `dependabot-upgrades ->
# main` consolidation PR, where the full matrix and CodeQL run exactly once.
# TRADE-OFF: a CVE fix therefore reaches `main` when that consolidation PR is
# opened, not the moment Dependabot files it. Open the consolidation PR promptly
# — it is the only thing standing between a staged security fix and `main`.
#
# Merge strategy: the incoming branch ALWAYS clobbers what is already staged
# (`git merge -X theirs`), so successive bumps of the same lock file never
# conflict-stall — the latest bump wins, every time.
#
# This file must exist on BOTH `main` and `dependabot-upgrades`: for
# `pull_request`, the workflow is read from the PR's BASE branch.
name: Dependabot auto-merge
'on':
  pull_request:
    branches:
      - dependabot-upgrades
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    name: Clobber-merge into dependabot-upgrades
    if: github.actor == 'dependabot[bot]'
    # Deliberately the standard runner, NOT vars.UBUNTU_RUNNER: a ~10-second
    # merge bot must not consume the larger (paid) runner the build matrix needs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot-upgrades
          fetch-depth: 0

      - name: Clobber-merge the bump and retire the PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pull the bump branch into a stable local ref we can re-merge.
          git fetch origin "+refs/heads/${PR_HEAD}:refs/remotes/origin/${PR_HEAD}"
          # Re-merge onto the LIVE staging tip and retry: concurrent Dependabot
          # PRs race to push here, so each attempt rebases on whatever already
          # landed and the incoming branch always wins conflicts (-X theirs).
          for attempt in 1 2 3 4 5; do
            git fetch origin "+refs/heads/dependabot-upgrades:refs/remotes/origin/dependabot-upgrades"
            git reset --hard "origin/dependabot-upgrades"
            git merge -X theirs --no-edit "origin/${PR_HEAD}" \
              -m "build(deps): clobber-merge ${PR_HEAD} into dependabot-upgrades"
            if git push origin "HEAD:dependabot-upgrades"; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::could not push to dependabot-upgrades after 5 attempts"
              exit 1
            fi
            sleep 5
          done
          # Retire the PR + its branch: the bump is already staged, so the PR
          # (whether it targeted main or staging) has served its purpose.
          # `|| true` — GitHub may have auto-closed it on the push.
          gh pr close "$PR_URL" --delete-branch \
            --comment "Swept into \`dependabot-upgrades\` (latest bump clobbers previous)." \
            || git push origin --delete "$PR_HEAD" || true
