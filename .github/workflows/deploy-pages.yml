---
# agent-pmo:a72c926
name: Deploy Pages
# The site deploys ON RELEASE ONLY. release.yml calls this workflow at the
# release ref once the GitHub release exists, so the published site can never
# get ahead of the artifact it documents. [DIST-RELEASE]
#
# There is deliberately NO `push: branches: [main]` trigger. It used to deploy
# every website commit immediately, which meant main could advertise a version,
# a download link or a feature that no released build had yet shipped.
# workflow_dispatch remains the manual recovery path.
'on':
  workflow_call:
  workflow_dispatch:
# Default every job to read-only and let the two jobs below widen what they
# actually need (`deploy` takes pages:write + id-token:write). Without this
# default the workflow inherits the repository's default token scope, which may
# be read/write on everything. [DIST-CI-SECURITY]
permissions:
  contents: read
concurrency:
  group: pages
  # NOTE: `queue: max` used to sit here. It is not a valid `concurrency` key —
  # GitHub accepts only `group` and `cancel-in-progress` — so the whole file was
  # an invalid workflow. `cancel-in-progress: false` already expresses the
  # intent: let a running deploy finish rather than cancelling it.
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/website/package-lock.json
      - run: npm ci
      - name: Build site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stamp deployment
        run: printf '%s\n' "$GITHUB_SHA" > _site/deployment-sha.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/website/_site
  deploy:
    name: Deploy
    needs: build
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify production website
        shell: bash
        env:
          PRODUCTION_URL: https://sharplsp.dev
        run: |
          set -euo pipefail
          expected_headline='SharpLsp: full C# and F# development.'
          expected_install='href="vscode:extension/nimblesite.sharplsp"'
          fetch() {
            curl --fail --silent --show-error --location \
              --connect-timeout 5 \
              --max-time 10 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              "$1" || true
          }

          for attempt in {1..30}; do
            probe="run_id=${GITHUB_RUN_ID}&run_attempt=${GITHUB_RUN_ATTEMPT}&attempt=${attempt}"
            deployed_sha="$(fetch "${PRODUCTION_URL}/deployment-sha.txt?${probe}")"

            if [[ "$deployed_sha" == "$GITHUB_SHA" ]]; then
              html="$(fetch "${PRODUCTION_URL}/?${probe}")"

              if grep --fixed-strings --quiet "$expected_headline" <<<"$html" \
                && grep --fixed-strings --quiet "$expected_install" <<<"$html"; then
                echo "Production is serving commit ${GITHUB_SHA} with the new SharpLsp experience."
                exit 0
              fi
            fi

            echo "Production has not converged yet (attempt ${attempt}/30)."
            sleep 10
          done

          echo "ERROR: ${PRODUCTION_URL} did not serve commit ${GITHUB_SHA} with the expected experience." >&2
          exit 1
