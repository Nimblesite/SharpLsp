# agent-pmo:0b21609
---
# Reusable VS Code leg of the PR pipeline on Ubuntu (called by ci.yml).
# Owns the FULL extension suite and the coverage gate; the Windows feature
# chunks in ci-vsix-windows.yml own platform coverage ([DIST-CI-WIN-VSIX]).
name: CI / VS Code
'on':
  workflow_call: {}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  test-vsix:
    name: Full Suite + Coverage
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    # TIMEOUT EXCEPTION: this job builds the Rust binary + .NET sidecars,
    # installs .NET 9 + 10, downloads the VS Code test host, then runs the full
    # ~530-test e2e suite (many tests spin up the Roslyn/FCS sidecars and load
    # real solutions). 10 minutes is too tight for the end-to-end run. The
    # real-repo stress suites additionally clone + restore three pinned real
    # repositories (serilog, FluentValidation, FsToolkit.ErrorHandling) and
    # cold-load their solutions in the sidecars, adding ~10-15 minutes on a cold
    # runner.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            9.0.x
            10.0.300
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/editors/vscode/package-lock.json
      - name: Install VS Code extension deps
        run: npm ci --prefix src/editors/vscode
      - name: Remove PATH-installed SharpLsp binaries
        shell: bash
        run: bash tools/vsix/purge-path-binaries.sh
      - name: Test VS Code extension with coverage
        run: xvfb-run -a make _test-vsix
      - name: Verify VSIX contains platform binary
        shell: bash
        run: |-
          set -euo pipefail
          platform="$(node -e 'process.stdout.write(`${process.platform}-${process.arch}`)')"
          unzip -l dist/sharplsp.vsix | grep -F "bin/${platform}/sharplsp"
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-vsix
          path: .config/coverage/thresholds.json
