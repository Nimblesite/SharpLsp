# agent-pmo:0b21609
---
# Implements [DIST-CI-VSIX-SHARDS]. Reusable VS Code leg of the PR pipeline on
# Ubuntu (called by ci.yml).
#
# This leg used to be ONE job running all 86 suites end to end. That job took 50
# minutes - 18 of them executing tests and 30 of them burning two 15-minute
# mocha hook ceilings on a single hung Test Explorer suite - and it was the
# critical path of the whole pipeline. It now fans out over the feature chunks
# declared in src/editors/vscode/test-chunks.json, so wall time is the slowest
# single chunk instead of the sum of all of them, and a hang costs one chunk
# instead of the suite.
#
# NOTHING IS BUILT TWICE.
#   * The host binary, both sidecars and netcoredbg come from the `build` leg
#     (ci-build.yml) as artifacts; `VSIX_PREBUILT=1` stages them as-is.
#   * The extension suite - clean, tsc, esbuild bundle, .NET test fixtures - is
#     compiled ONCE by the `suite` job below and published as an artifact; every
#     shard downloads it and sets `VSIX_SUITE_PREBUILT=1`. Compiling per shard
#     multiplied minutes of identical work by the width of the matrix.
#   * The VS Code test host download is cached per runner OS.
#
# EVERY SHARD IS INSTRUMENTED, on this leg and on Windows. Neither leg gates:
# no chunk can meet the line threshold alone, so the single ratcheted gate runs
# at the end of the pipeline over the union of both platforms
# ([DIST-CI-VSIX-COVERAGE], ci-vsix-coverage.yml).
#
# The Windows leg (ci-vsix-windows.yml) owns win32 platform coverage; the chunks
# marked `linuxOnly` in the manifest - the real-world-repository stress suites -
# run only here.
name: CI / VS Code
'on':
  workflow_call: {}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  suite:
    # Compile the suite once and resolve the shard matrix in the same job: both
    # read the same working tree, and neither needs the LSP binaries.
    name: Compile suite
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      chunks: ${{ steps.suite.outputs.chunks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile the suite and resolve the matrix
        id: suite
        uses: ./.github/actions/vsix-suite
        with:
          platform: linux
          suite-artifact: vsix-suite-linux
  test-vsix:
    name: ${{ matrix.chunk }}
    needs:
      - suite
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    # A shard now only installs deps, downloads a compiled suite and prebuilt
    # binaries, and runs its slice against real Roslyn/FCS sidecars. The fixed
    # prelude is well under a minute; the heaviest slice (a real-world repository
    # clone + restore) adds ~10 on a cold cache.
    #
    # A shard approaching this ceiling is a bug to investigate, not a budget to
    # grow: the per-test ceilings live in src/test/suite/test-timeouts.ts and
    # none of them exceeds 2 minutes.
    timeout-minutes: 25
    strategy:
      # Every chunk is an independent feature area: one failure must not cancel
      # the rest, or a single flake hides the state of the whole surface. The
      # coverage gate still needs them all, so a failed chunk fails the leg.
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.suite.outputs.chunks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the shard
        uses: ./.github/actions/vsix-shard
        with:
          chunk: ${{ matrix.chunk }}
          platform: linux
          suite-artifact: vsix-suite-linux
          binaries-artifact: linux-lsp-binaries
          debugger-artifact: linux-netcoredbg
          debugger-path: target/netcoredbg/linux-x64/netcoredbg
          xvfb: 'true'
          user-data-dir: ${{ runner.temp }}/vsx-${{ matrix.chunk }}
  payload:
    name: VSIX Payload
    # The packaged VSIX must carry the platform binary. This was a step inside
    # the old single test job, so a .vscodeignore mistake was only reported
    # after 18 minutes of tests. As its own job it reports in about three - and
    # keeping it out of the shards matters for more than speed: it leaves a
    # PRODUCTION bundle in dist/, whose missing sourcemap would strip the
    # end-to-end coverage the shards exist to collect.
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pack and verify the VSIX
        uses: ./.github/actions/vsix-payload
        with:
          binaries-artifact: linux-lsp-binaries
          debugger-artifact: linux-netcoredbg
          debugger-path: target/netcoredbg/linux-x64/netcoredbg
