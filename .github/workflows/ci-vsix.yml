# agent-pmo:0b21609
---
# Reusable VS Code leg of the PR pipeline on Ubuntu (called by ci.yml).
# Owns the FULL extension suite and the coverage gate; the Windows feature
# chunks in ci-vsix-windows.yml own platform coverage ([DIST-CI-WIN-VSIX]).
#
# The host binary + both sidecars + netcoredbg are produced ONCE by the
# `build` leg (ci-build.yml) and downloaded here: this job never rebuilds Rust
# or .NET — `VSIX_PREBUILT=1` stages the downloaded artifacts as-is.
name: CI / VS Code
'on':
  workflow_call: {}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  test-vsix:
    name: Full Suite + Coverage
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    # TIMEOUT EXCEPTION: this job downloads the prebuilt binaries, installs
    # .NET 9 + 10, downloads the VS Code test host, then runs the full
    # ~530-test e2e suite (many tests spin up the Roslyn/FCS sidecars and load
    # real solutions). The real-repo stress suites additionally clone + restore
    # three pinned real repositories (serilog, FluentValidation,
    # FsToolkit.ErrorHandling) and cold-load their solutions in the sidecars.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            9.0.x
            10.0.300
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/editors/vscode/package-lock.json
      - name: Install VS Code extension deps
        run: npm ci --prefix src/editors/vscode
      - name: Download prebuilt Linux LSP artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-lsp-binaries
          path: target
      - name: Download prebuilt Linux debugger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-netcoredbg
          path: target/netcoredbg/linux-x64/netcoredbg
      - name: Remove PATH-installed SharpLsp binaries
        shell: bash
        run: bash tools/vsix/purge-path-binaries.sh
      - name: Test VS Code extension with coverage (prebuilt binaries)
        # VSIX_PREBUILT=1 stages the downloaded host + sidecars + netcoredbg
        # instead of rebuilding Rust and .NET inside the test job.
        run: xvfb-run -a env VSIX_PREBUILT=1 make _test-vsix
      - name: Verify VSIX contains platform binary
        shell: bash
        run: |-
          set -euo pipefail
          platform="$(node -e 'process.stdout.write(`${process.platform}-${process.arch}`)')"
          unzip -l dist/sharplsp.vsix | grep -F "bin/${platform}/sharplsp"
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-vsix
          path: coverage-thresholds.json
