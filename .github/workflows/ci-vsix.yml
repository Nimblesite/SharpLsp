# agent-pmo:0b21609
---
# Implements [DIST-CI-VSIX-SHARDS]. Reusable VS Code leg of the PR pipeline on
# Ubuntu (called by ci.yml).
#
# This leg used to be ONE job running all 86 suites end to end. That job took 50
# minutes - 18 of them executing tests and 30 of them burning two 15-minute
# mocha hook ceilings on a single hung Test Explorer suite - and it was the
# critical path of the whole pipeline. It now fans out over the SAME feature
# chunks the Windows leg uses (src/editors/vscode/test-chunks.json), so wall
# time is the slowest single chunk instead of the sum of all of them, and a hang
# costs one chunk instead of the suite.
#
# Coverage is why this leg exists, and sharding does not weaken it: every chunk
# runs instrumented and exports an lcov tracefile, and `coverage` below
# union-merges them and applies the one ratcheted gate - the same shape as the
# Rust shards ([DIST-CI-RUST-SHARDS]). No chunk can meet the threshold alone, so
# the gate never runs per chunk.
#
# The Windows leg (ci-vsix-windows.yml) owns win32 platform coverage; the chunks
# marked `linuxOnly` in the manifest - the real-world-repository stress suites -
# run only here.
#
# The host binary + both sidecars + netcoredbg are produced ONCE by the `build`
# leg (ci-build.yml) and downloaded here: no job in this file ever rebuilds Rust
# or .NET - `VSIX_PREBUILT=1` stages the downloaded artifacts as-is.
name: CI / VS Code
'on':
  workflow_call: {}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  chunks:
    name: Resolve chunks
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Resolve feature chunk matrix
        shell: bash
        id: chunks
        run: |-
          set -euo pipefail
          chunks="$(node tools/vsix/vsix-test-chunks.mjs matrix linux)"
          echo "chunks=${chunks}" >> "$GITHUB_OUTPUT"
          echo "Ubuntu VS Code coverage shards: ${chunks}"
  test-vsix:
    name: ${{ matrix.chunk }}
    needs:
      - chunks
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    # A shard installs npm deps, compiles + bundles the extension, downloads the
    # VS Code test host, then runs its slice against real Roslyn/FCS sidecars
    # loading real solutions. That fixed prelude is ~3 minutes; the heaviest
    # slice (a real-world repository clone + restore) adds ~10 on a cold cache.
    # A shard approaching this ceiling is a bug to investigate, not a budget to
    # grow: the per-test ceilings live in src/test/suite/test-timeouts.ts and
    # none of them exceeds 4 minutes.
    timeout-minutes: 25
    strategy:
      # Every chunk is an independent feature area: one failure must not cancel
      # the rest, or a single flake hides the state of the whole surface. The
      # coverage gate still needs them all, so a failed chunk fails the leg.
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.chunks.outputs.chunks) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            9.0.x
            10.0.303
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/editors/vscode/package-lock.json
      - name: Install VS Code extension deps
        run: npm ci --prefix src/editors/vscode
      - name: Download prebuilt Linux LSP artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-lsp-binaries
          path: target
      - name: Download prebuilt Linux debugger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-netcoredbg
          path: target/netcoredbg/linux-x64/netcoredbg
      - name: Remove PATH-installed SharpLsp binaries
        shell: bash
        run: bash tools/vsix/purge-path-binaries.sh
      - name: Run VS Code coverage shard (prebuilt binaries)
        # VSIX_PREBUILT=1 stages the downloaded host + sidecars + netcoredbg
        # instead of rebuilding Rust and .NET inside the test job.
        env:
          # Pin the test host's user-data dir (honoured by .vscode-test.mjs) so
          # the diagnostics step below knows where the extension-host logs land
          # instead of guessing at the runner's os.tmpdir(). Mirrors the Windows
          # leg.
          VSCODE_TEST_USER_DATA_DIR: ${{ runner.temp }}/vsx-${{ matrix.chunk }}
        run: xvfb-run -a env VSIX_PREBUILT=1 make _test-vsix-shard CHUNK=${{ matrix.chunk }}
      - name: Upload shard coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-vsix-shard-${{ matrix.chunk }}
          retention-days: 1
          path: target/coverage-vsix-shard-${{ matrix.chunk }}.lcov
      - name: Upload failure diagnostics
        # A chunk that fails or HANGS is exactly what this split exists to
        # isolate, so keep the extension-host logs for triage.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-logs-${{ matrix.chunk }}
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/vsx-${{ matrix.chunk }}/logs
  coverage:
    name: Coverage Gate
    needs:
      - test-vsix
    # [DIST-CI-VSIX-SHARDS] The single ratcheted coverage gate for the extension.
    # Every shard instruments the same bundle, so a file loaded by any shard
    # carries its whole line set there (unexecuted lines as `DA:<line>,0`) and
    # the union reproduces the line percentage of one unsharded run.
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # check-coverage.mjs ratchets against the threshold committed at the
          # merge base, which a shallow checkout does not contain.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-vsix-shard-*
          merge-multiple: true
          path: target
      - name: Merge shard coverage and enforce threshold
        run: make _gate-vsix-coverage
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-vsix
          path: |
            target/coverage-vsix.lcov
            coverage-thresholds.json
  payload:
    name: VSIX Payload
    # The packaged VSIX must carry the platform binary. This was a step inside
    # the old single test job, so a .vscodeignore mistake was only reported
    # after 18 minutes of tests. As its own job it reports in about three.
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            9.0.x
            10.0.303
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/editors/vscode/package-lock.json
      - name: Install VS Code extension deps
        run: npm ci --prefix src/editors/vscode
      - name: Download prebuilt Linux LSP artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-lsp-binaries
          path: target
      - name: Download prebuilt Linux debugger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-netcoredbg
          path: target/netcoredbg/linux-x64/netcoredbg
      - name: Build the VSIX
        run: env VSIX_PREBUILT=1 make _build-vsix
      - name: Verify VSIX contains platform binary
        shell: bash
        run: |-
          set -euo pipefail
          platform="$(node -e 'process.stdout.write(`${process.platform}-${process.arch}`)')"
          unzip -l dist/sharplsp.vsix | grep -F "bin/${platform}/sharplsp"
