# agent-pmo:0b21609
---
# PHASE 5 — COVERAGE CHECK.
#
# The two SHARDED suites gate here, and only here. A gate needs a complete
# tracefile, and neither of these produces one in any single job: the Rust suite
# runs as 2 nextest partitions ([DIST-CI-RUST-SHARDS]) and the VS Code suite as
# ~26 Ubuntu plus ~23 Windows feature chunks ([DIST-CI-VSIX-SHARDS],
# [DIST-CI-WIN-VSIX]). No shard can meet the line threshold alone, so every
# shard exports lcov and gates nothing, and the ratchet runs once over the union.
#
# The unsharded legs - .NET sidecars, Zed, Rider - apply their ratchet inside
# their own test job, where the tracefile is already complete. Routing them
# through here would add an artifact round trip to reach the same number.
#
# Why the union is sound: every shard instruments the SAME build, so a file
# loaded by any shard carries its whole line set there (unexecuted lines as
# `DA:<line>,0`), and summing hit counts per (file, line) reproduces the line
# percentage of one unsharded run. VS Code shards write repo-relative `SF:` paths
# (tools/coverage/relativize-lcov.mjs) so a file measured on Windows and on
# Ubuntu keys as ONE file rather than two - without that the denominator would
# double and the gate would fail for a reason unrelated to coverage.
name: CI / Coverage
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  coverage-rust:
    name: Rust
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # check-coverage.mjs ratchets against the threshold committed at the
          # merge base, which a shallow checkout does not contain.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-rust-shard-*
          merge-multiple: true
          path: target
      - name: Merge shard coverage and enforce threshold
        run: make _gate-rust-coverage
      - name: Upload merged coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust
          path: |
            target/coverage-rust.lcov
            coverage-thresholds.json

  coverage-vsix:
    name: VS Code
    # [DIST-CI-VSIX-COVERAGE] ONE gate for the extension, over the shards of
    # BOTH platforms. Gating per leg would have let the Windows shards run
    # uninstrumented while Ubuntu carried the whole number - which is exactly
    # what happened the last time these two legs drifted apart.
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Download every shard tracefile (both platforms)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-vsix-shard-*
          merge-multiple: true
          path: target
      - name: Merge shard coverage and enforce threshold
        run: make _gate-vsix-coverage
      - name: Upload merged coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-vsix
          path: |
            target/coverage-vsix.lcov
            coverage-thresholds.json
