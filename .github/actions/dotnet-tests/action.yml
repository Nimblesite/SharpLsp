---
# Implements [DIST-CI-ARTIFACT-TESTS]. No compilation in this consumer.
name: Restore precompiled .NET tests
description: Fetch this run's Release binaries and rebase NuGet metadata only.
inputs:
  artifact:
    description: Platform-specific artifact emitted by build-platform.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: target
    - name: Restore compiled tests and machine-local package paths
      shell: bash
      run: |-
        set -euo pipefail
        tar -xzf target/dotnet-tests.tar.gz
        dotnet restore src/sidecars/SharpLsp.Sidecars.sln -p:Configuration=Release
