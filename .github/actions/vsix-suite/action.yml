# agent-pmo:0b21609
---
# Implements [DIST-CI-VSIX-SHARDS]. ONE composite action that compiles the VS
# Code suite a single time and resolves the shard matrix, used by both platform
# legs.
#
# `npm run pretest` is the expensive, entirely shard-independent half of a run:
# clean, type-check the whole suite, bundle the extension, build the .NET test
# fixtures. Running it inside every shard multiplied minutes of identical work
# by the width of the matrix. It happens here once per platform and the result
# is published for every shard to download.
#
# The chunk matrix is resolved in the same place because it reads the same
# working tree and needs nothing else. Chunk membership lives in
# src/editors/vscode/test-chunks.json and is NEVER duplicated into CI YAML.
name: Compile the VS Code suite once
description: >-
  Installs deps, resolves the feature-chunk matrix for this platform, compiles
  the test suite and static fixtures. build-platform publishes these, with the
  test bundle, after packaging the VSIX.
inputs:
  platform:
    description: '"linux" or "win" — selects which chunks this leg runs.'
    required: true
outputs:
  chunks:
    description: JSON array of chunk names for this platform's matrix.
    value: ${{ steps.chunks.outputs.chunks }}
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          9.0.x
          10.0.403
    - name: Install VS Code extension deps
      uses: ./.github/actions/vsix-node-deps
    - name: Verify Windows skill junction repair
      if: inputs.platform == 'win'
      shell: bash
      run: node --test tools/vsix/resolve-symlink-stubs.test.mjs
    - name: Resolve the feature chunk matrix
      id: chunks
      shell: bash
      run: |-
        set -euo pipefail
        chunks="$(node tools/vsix/vsix-test-chunks.mjs matrix ${{ inputs.platform }})"
        echo "chunks=${chunks}" >> "$GITHUB_OUTPUT"
        echo "${{ inputs.platform }} VS Code coverage shards: ${chunks}"
    - name: Compile the suite once
      shell: bash
      run: make _build-vsix-suite
