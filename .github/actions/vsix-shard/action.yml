# agent-pmo:0b21609
---
# Implements [DIST-CI-VSIX-SHARDS]. ONE composite action running ONE VS Code
# coverage shard, used verbatim by both platform legs.
#
# The Ubuntu and Windows legs run the same ten steps against different artifact
# names: install deps, pull down the once-compiled suite and the once-built
# binaries, cache the VS Code test host, purge stray SharpLsp binaries from
# PATH, run `_test-vsix-shard`, publish the tracefile, keep the logs on failure.
# Duplicating that in both workflows is how they drifted apart the first time -
# one leg ended up instrumented and the other did not.
#
# The caller supplies only what genuinely differs: artifact names, where the
# debugger unpacks, the coverage tracefile's platform tag, and whether the
# runner needs a virtual X server.
name: Run one VS Code coverage shard
description: >-
  Downloads the packaged VSIX and compiled suite/fixtures, restores NuGet
  metadata without compiling, runs one feature chunk, and uploads coverage.
inputs:
  chunk:
    description: Chunk name from src/editors/vscode/test-chunks.json.
    required: true
  platform:
    description: >-
      Node's `process.platform` for this runner ("linux" or "win32"). Tags the
      shard tracefile so both legs' artifacts can land in one directory.
    required: true
  suite-artifact:
    description: Artifact holding compiled tests, static fixtures and the test bundle.
    required: true
  xvfb:
    description: '"true" to wrap the run in xvfb-run (Ubuntu has no desktop session).'
    required: false
    default: 'false'
  user-data-dir:
    description: Test-host --user-data-dir, so the failure-log step knows where logs land.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          9.0.x
          10.0.403
    # The ubuntu-26.04 image added .NET 11 (SDK 11.0.100 and its runtimes) on
    # 2026-11-11. Suites that build fixtures under /tmp sit outside global.json,
    # and suites that target the newest installed runtime then pick net11.0, so
    # the shard silently stops testing the SDK the repo pins. Remove every .NET
    # component newer than the pinned major: SDKs, runtimes, packs, manifests.
    - name: Remove .NET components newer than the global.json pin
      if: runner.os == 'Linux'
      shell: bash
      run: |-
        set -euo pipefail
        root="${DOTNET_ROOT:-/usr/share/dotnet}"
        sudo find "$root" -mindepth 1 -maxdepth 3 -type d \
          -regex '.*/\(1[1-9]\|[2-9][0-9]\)\.[0-9][^/]*' -prune -exec rm -rf {} +
        # global.json rolls forward to the latest patch, so a newer preinstalled
        # 10.0.x SDK (10.0.404 changed F# name resolution) would silently win.
        pinned="$(jq -r .sdk.version global.json)"
        for sdk in "$root"/sdk/*/; do
          version="$(basename "$sdk")"
          newest="$(printf '%s\n%s\n' "$pinned" "$version" | sort -V | tail -1)"
          if [ "$version" != "$pinned" ] && [ "$newest" = "$version" ]; then sudo rm -rf "$sdk"; fi
        done
        dotnet --list-sdks
        dotnet --list-runtimes
    - name: Install VS Code extension deps
      uses: ./.github/actions/vsix-node-deps
    - name: Download the compiled suite
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.suite-artifact }}
        path: src/editors/vscode
    - name: Download the packaged Release VSIX
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.suite-artifact }}-release
        path: target/vsix
    - name: Cache the NuGet store
      # Restore rebases asset paths for the cached static fixture binaries.
      # No dotnet build is permitted here.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: >-
          nuget-${{ runner.os }}-${{ hashFiles('src/editors/vscode/test-fixtures/**/*.*proj') }}
        restore-keys: nuget-${{ runner.os }}-
    - id: host-key
      uses: ./.github/actions/vscode-test-host-key
    - name: Restore the VS Code test host
      # Restore only: seed-vscode-test-host.yml saves it, once per release, where
      # every pull request can read it ([DIST-CI-VSIX-HOST-CACHE]).
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: src/editors/vscode/.vscode-test
        key: ${{ steps.host-key.outputs.key }}
        restore-keys: ${{ steps.host-key.outputs.prefix }}
    - name: Install .NET diagnostic tools
      # The workspace chunk's profiler suites trace and dump real processes,
      # exactly as ci-test-rust.yml's profiler e2e tests do.
      if: inputs.chunk == 'workspace'
      shell: bash
      run: |-
        set -euo pipefail
        dotnet tool install -g dotnet-trace
        dotnet tool install -g dotnet-counters
        dotnet tool install -g dotnet-dump
    - name: Remove PATH-installed SharpLsp binaries
      # Force the test host onto the freshly-staged bundled binaries, never a dev
      # copy that leaked onto the runner PATH.
      shell: bash
      run: bash tools/vsix/purge-path-binaries.sh
    - name: Run the VS Code coverage shard
      shell: bash
      env:
        # Pin the test host's user-data dir (honoured by .vscode-test.mjs) so the
        # diagnostics step below knows where the extension-host logs land instead
        # of guessing at the runner's os.tmpdir().
        VSCODE_TEST_USER_DATA_DIR: ${{ inputs.user-data-dir }}
        # Stage the downloaded host + sidecars + debugger instead of rebuilding
        # Rust and .NET, and reuse the compiled suite instead of running
        # `pretest` again.
        VSIX_PREBUILT: '1'
        VSIX_SUITE_PREBUILT: '1'
        VSIX_ARTIFACT: target/vsix/sharplsp.vsix
        # Record every DAP request and response the router sees. A debug leg
        # that passed says nothing about WHICH path passed it - a `terminated`
        # the adapter sent and one the ShutdownDeadline synthesised look the
        # same to mocha - and the trace is the only record that tells them
        # apart. Off, the log carries the router's console lines and no traffic.
        SHARPLSP_DAP_TRACE: '1'
      run: |-
        set -euo pipefail
        if [ "${{ inputs.xvfb }}" = "true" ]; then
          xvfb-run -a make _test-vsix-shard CHUNK=${{ inputs.chunk }}
        else
          make _test-vsix-shard CHUNK=${{ inputs.chunk }}
        fi
    - name: Upload shard coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-vsix-shard-${{ inputs.platform }}-${{ inputs.chunk }}
        retention-days: 1
        path: target/coverage-vsix-shard-${{ inputs.platform }}-${{ inputs.chunk }}.lcov
    - name: Collect server and compiler logs
      # The host and both sidecars log beneath the system temp folder, where the
      # extension host's logs never reach: a compiler request that stops
      # answering is visible only there. [DIST-CI-VSIX-SHARDS]
      if: always()
      shell: bash
      run: |
        logs="$(node -e 'process.stdout.write(require("os").tmpdir())')/sharplsp-logs"
        if [ -d "$logs" ]; then
          mkdir -p "${{ inputs.user-data-dir }}/logs"
          cp -R "$logs" "${{ inputs.user-data-dir }}/logs/sharplsp-logs"
        fi
    - name: Upload extension-host diagnostics
      # A chunk that fails or HANGS is exactly what the split exists to isolate,
      # so keep the extension-host logs for triage. Keep them for a GREEN chunk
      # too: a fallback that fired - the ShutdownDeadline ending a wedged stop,
      # a retried attach - leaves its line in these logs and nowhere else, so a
      # green run's logs are the evidence that the fix, not luck, passed it.
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vsix-logs-${{ inputs.platform }}-${{ inputs.chunk }}
        retention-days: 3
        if-no-files-found: ignore
        path: ${{ inputs.user-data-dir }}/logs
