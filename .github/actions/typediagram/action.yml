---
# The extension's tutorial model is generated with typeDiagram ([TUTORIAL-MODEL]).
# Pinned to the version lspkit's CI installs.
name: Install typeDiagram
description: Puts the typeDiagram CLI that the tutorial model generator needs on PATH.
runs:
  using: composite
  steps:
    - name: Install typeDiagram
      shell: bash
      run: |-
        if [ "$(typediagram --version 2>/dev/null || true)" != 'typediagram 0.11.0' ]; then
          npm install -g typediagram@0.11.0
        fi
