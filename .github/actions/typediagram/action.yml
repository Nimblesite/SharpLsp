---
# The lspkit submodule's profiler generates its wire model with typeDiagram:
# lsp-profiler's build.rs runs it on every Rust build of the host, and
# `make _build-profiler-ui` runs it before the UI package compiles
# ([PROFILER-SHARED-LIBRARY]). Pinned to the version lspkit's CI installs.
name: Install typeDiagram
description: Puts the typeDiagram CLI that lspkit's profiler code generation needs on PATH.
runs:
  using: composite
  steps:
    - name: Install typeDiagram
      shell: bash
      run: |-
        if [ "$(typediagram --version 2>/dev/null || true)" != 'typediagram 0.11.0' ]; then
          npm install -g typediagram@0.11.0
        fi
