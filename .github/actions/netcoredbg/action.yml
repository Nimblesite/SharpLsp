# agent-pmo:0b21609
---
# PHASE 2 (FULL BUILD). Puts the upstream netcoredbg debug adapter for one
# platform on disk. [DIST-DEBUGGER-BUNDLE]
#
# It does not decide HOW. tools/netcoredbg/provide.mjs owns that: it downloads
# the SHA-256-pinned upstream archive named in netcoredbg.lock.json and verifies
# the bytes. The debugger is never compiled. CI, `make` and the release all go
# through it, so there is one answer to "which netcoredbg is this" everywhere.
# The cache only saves the download; its key is the lock file.
name: Provide netcoredbg
description: >-
  Downloads and SHA-256-verifies the pinned upstream netcoredbg archive for the
  given platform.
inputs:
  vsix-platform:
    description: Target platform triple, e.g. linux-x64 or win32-x64.
    required: true
outputs:
  path:
    description: Directory holding the adapter.
    value: target/netcoredbg/${{ inputs.vsix-platform }}/netcoredbg
runs:
  using: composite
  steps:
    - name: Restore a previously downloaded adapter
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # The `.sharplsp-netcoredbg-release` marker provide.mjs checks is a
        # dotfile; actions/cache preserves it, so a hit skips the download.
        path: target/netcoredbg/${{ inputs.vsix-platform }}/netcoredbg
        key: >-
          netcoredbg-${{ inputs.vsix-platform }}-${{ hashFiles('tools/netcoredbg/netcoredbg.lock.json') }}
    - name: Download the pinned adapter
      shell: bash
      run: node tools/netcoredbg/provide.mjs ${{ inputs.vsix-platform }}
